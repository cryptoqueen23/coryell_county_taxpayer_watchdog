<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Financial Change Alerts</title><style>body{margin:0;background:#f4f6f8;color:#142c43;font:16px/1.5 system-ui}header,main{max-width:960px;margin:auto;padding:1rem}header{background:#142c43;color:white}header a{color:white}article{background:white;border-left:4px solid #b18a3e;padding:1rem;margin:1rem 0;overflow-wrap:anywhere}button,select{font:inherit;padding:.5rem;max-width:100%}a{color:#215b86}small{display:block}</style><header><a href="/">Coryell County Taxpayer Watchdog</a><h1 id="heading"></h1><button id="lang"></button></header><main><p id="notice"></p><p id="checked" role="status"></p><label for="filter" id="label"></label> <select id="filter"></select><div id="records"></div><p><a href="/vault.html" id="vault"></a></p></main><script>const $=id=>document.getElementById(id);let es=localStorage.getItem('lang')==='es',data=null,error=false;const tr=(a,b)=>es?b:a;const statuses={changed_review_required:['Change detected; review required','Cambio detectado; revisión necesaria'],unchanged:['Unchanged since baseline','Sin cambios desde la referencia'],initial_observation:['Initial observation; not authenticated','Observación inicial; no autenticada'],unavailable_or_non_pdf:['Unavailable or non-PDF; review needed','No disponible o no es PDF; requiere revisión']};function render(){document.documentElement.lang=es?'es':'en';$('heading').textContent=tr('Public Financial Change Alerts','Alertas de cambios financieros');$('lang').textContent=tr('🇵🇷 Español','🇺🇸 English');$('notice').textContent=tr('Document changes are not proof of new taxes, fees, spending or debt. Financial conclusions require manual review. Only registered PDF sources are monitored; this is not a complete government filing feed.','Los cambios de documentos no prueban nuevos impuestos, tarifas, gastos o deuda. Las conclusiones requieren revisión manual. Solo se monitorean PDF registrados; no es un registro completo de publicaciones oficiales.');$('label').textContent=tr('Filter status','Filtrar estado');$('vault').textContent=tr('Public Records Vault','Archivo de documentos públicos');let selected=$('filter').value;$('filter').replaceChildren();for(let [key,labels] of Object.entries({all:['All observations','Todas las observaciones'],...statuses})){let o=document.createElement('option');o.value=key;o.textContent=labels[es?1:0];$('filter').append(o)}$('filter').value=selected||'all';$('records').replaceChildren();$('checked').textContent=data?tr('Last observation: ','Última observación: ')+new Date(data.checkedAt).toLocaleString(es?'es-US':'en-US'):error?tr('No monitoring report available yet. This does not mean no changes occurred.','Aún no hay informe disponible. Esto no significa que no hubo cambios.'):tr('Loading observations…','Cargando observaciones…');if(!data)return;let rows=data.records.filter(r=>$('filter').value==='all'||r.status===$('filter').value);rows.sort((a,b)=>Number(b.status==='changed_review_required')-Number(a.status==='changed_review_required'));for(let r of rows){let c=document.createElement('article');function add(tag,t){let e=document.createElement(tag);e.textContent=t;c.append(e);return e}add('small',r.id);add('h2',r.title);add('p',(statuses[r.status]||[r.status,r.status])[es?1:0]);if(r.url&&r.url.startsWith('https://')){let a=add('a',tr('View government source','Ver fuente oficial'));a.href=r.url;a.rel='noopener noreferrer';a.target='_blank'}if(r.baseline)add('small',tr('Baseline SHA-256: ','SHA-256 de referencia: ')+r.baseline);if(r.observedSha256)add('small',tr('Observed SHA-256: ','SHA-256 observado: ')+r.observedSha256);$('records').append(c)}if(!rows.length)$('records').textContent=tr('No observations match this filter.','No hay observaciones para este filtro.')} $('filter').onchange=render;$('lang').onclick=()=>{es=!es;localStorage.setItem('lang',es?'es':'en');render()};render();fetch('source-monitor.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(!Array.isArray(d.records))throw Error();data=d;render()}).catch(()=>{error=true;render()});</script></html>
