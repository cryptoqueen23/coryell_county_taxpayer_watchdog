<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>County payment register</title><style>body{font:16px/1.5 system-ui;color:#142c43;background:#f4f6f8;margin:0}header,main{padding:1rem;max-width:1000px;margin:auto}header{background:#142c43;color:white}header a{color:white}input,select,button{font:inherit;padding:.65rem;max-width:100%;box-sizing:border-box}label{display:block;margin-top:.8rem}article{background:white;border-left:4px solid #b18a3e;padding:1rem;margin:.7rem 0;overflow-wrap:anywhere}pre{white-space:pre-wrap;font-size:.85rem}button{cursor:pointer}</style><header><a href="/">Coryell County Taxpayer Watchdog</a><h1 id="title">FY2025 county payment register</h1><button id="lang">🇵🇷 Español</button></header><main><p id="warning">Provisional extraction. Recorded payments are not audited expenditures. Extraction count reconciled; official PDF hyperlink and accounting classification pending.</p><label for="q" id="ql">Vendor, check or date</label><input id="q" type="search"><label for="fund" id="fl">Fund</label><select id="fund"><option value="">All</option></select><label for="min" id="ml">Minimum amount ($)</label><input id="min" type="number" placeholder="0"><label for="classify" id="cl">Preliminary payee classification</label><select id="classify"><option value="">All</option><option value="internal">Potential internal fund activity</option><option value="payroll">Payroll / withholding / benefits</option><option value="bank">Bank / possible financing</option><option value="other">Other / unclassified</option></select><p id="count" role="status"></p><div id="summary"></div><div id="results"></div><button id="prev">Previous</button> <button id="next">Next</button></main><script>const $=x=>document.getElementById(x);let rows=[],page=0,es=localStorage.getItem('lang')==='es';function classify(x){const v=x.vendor.toUpperCase();if(/PAYROLL CLEARING|SOCIAL SECURITY\/WITHHOLDING|EMPLOYEE BENEFITS|TEXAS COUNTY & DISTRICT RETIREMENT/.test(v))return 'payroll';if(/^(CORYELL COUNTY GENERAL FUND|CORYELL COUNTY UND\. ROAD & BRIDGE|CORYELL COUNTY INTEREST & SINKING F|CORYELL CO CAPITAL IMP FUND|CORYELL COUNTY RECORDS MANAGEMENT F)$/.test(v))return 'internal';if(/^(WEBSTER BANK LOAN OPERATIONS|FIRST NATIONAL BANK)$/.test(v))return 'bank';return 'other'}function render(){let q=$('q').value.toLowerCase(),f=$('fund').value,m=$('min').value;let a=rows.filter(x=>(!$('classify').value||classify(x)===$('classify').value)&&(!f||x.fund===f)&&(!m||x.amount>=Number(m))&&[x.vendor,x.check,x.date].join(' ').toLowerCase().includes(q));const groups=new Map();for(const x of a){let g=groups.get(x.vendor)||{cents:0,count:0};g.cents+=Math.round(x.amount*100);g.count++;groups.set(x.vendor,g)}const summary=$('summary');summary.replaceChildren();let heading=document.createElement('h2');heading.textContent=es?'Resumen de pagos filtrados':'Filtered payment summary';summary.append(heading);let total=document.createElement('p');total.textContent=(es?'Valor neto registrado: ':'Net recorded value: ')+(a.reduce((n,x)=>n+Math.round(x.amount*100),0)/100).toLocaleString('en-US',{style:'currency',currency:'USD'});summary.append(total);let details=document.createElement('details'),label=document.createElement('summary');label.textContent=es?'Proveedores por valor neto (primeros 25)':'Vendors by net recorded value (top 25)';details.append(label);for(const [name,g] of [...groups].sort((a,b)=>b[1].cents-a[1].cents).slice(0,25)){let p=document.createElement('p');p.textContent=name+' · '+(g.cents/100).toLocaleString('en-US',{style:'currency',currency:'USD'})+' · '+g.count;details.append(p)}summary.append(details);page=Math.min(page,Math.max(0,Math.ceil(a.length/25)-1));$('count').textContent=a.length+(es?' registros · página ':' records · page ')+(page+1)+' / '+Math.max(1,Math.ceil(a.length/25));$('results').replaceChildren();for(let x of a.slice(page*25,page*25+25)){let card=document.createElement('article');for(let [tag,t] of [['h3',x.vendor],['p',x.amount.toLocaleString('en-US',{style:'currency',currency:'USD'})],['p',(es?'Cheque ':'Check ')+x.check+' · '+x.date+' · '+(es?'Fondo ':'Fund ')+x.fund],['p','FY2025 Accounts Payable Check Register · PDF '+x.page],['p',(es?'Clasificación preliminar: ':'Preliminary classification: ')+$('classify').querySelector('option[value='+classify(x)+']').textContent],['pre',x.quote]]){let e=document.createElement(tag);e.textContent=t;card.append(e)}$('results').append(card)}$('prev').disabled=page===0;$('next').disabled=(page+1)*25>=a.length}function lang(){const labels=es?['Todos','Posible actividad entre fondos','Nómina / retenciones / beneficios','Banco / posible financiamiento','Otros / sin clasificar']:['All','Potential internal fund activity','Payroll / withholding / benefits','Bank / possible financing','Other / unclassified'];[...$('classify').options].forEach((o,i)=>o.textContent=labels[i]);$('cl').textContent=es?'Clasificación preliminar del beneficiario':'Preliminary payee classification';document.documentElement.lang=es?'es':'en';$('title').textContent=es?'Registro de pagos del condado FY2025':'FY2025 county payment register';$('warning').textContent=es?'Extracción provisional. Los pagos registrados no son gastos auditados. Conteo conciliado; enlace PDF oficial y clasificación contable pendientes.':'Provisional extraction. Recorded payments are not audited expenditures. Extraction count reconciled; official PDF hyperlink and accounting classification pending.';$('ql').textContent=es?'Proveedor, cheque o fecha':'Vendor, check or date';$('fl').textContent=es?'Fondo':'Fund';$('ml').textContent=es?'Monto mínimo ($)':'Minimum amount ($)';$('fund').options[0].textContent=es?'Todos':'All';$('prev').textContent=es?'Anterior':'Previous';$('next').textContent=es?'Siguiente':'Next';$('lang').textContent=es?'🇺🇸 English':'🇵🇷 Español';render()}$('lang').onclick=()=>{es=!es;localStorage.setItem('lang',es?'es':'en');lang()};for(let id of ['q','fund','min','classify'])$(id).oninput=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};lang();fetch('payments.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{rows=d.rows;for(let f of [...new Set(rows.map(x=>x.fund))].sort()){let o=document.createElement('option');o.value=o.textContent=f;$('fund').append(o)}render()}).catch(()=>{$('count').textContent=es?'Error de carga':'Unable to load register'});</script></html>
