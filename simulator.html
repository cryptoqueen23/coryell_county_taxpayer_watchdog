<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Household cost simulator</title><style>body{margin:0;background:#f4f6f8;color:#142c43;font:16px/1.5 system-ui}header,main{padding:1rem;max-width:900px;margin:auto}header{background:#142c43;color:white}header a{color:white}label{display:block;margin-top:1rem}input,button{font:inherit;padding:.5rem;max-width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:right;padding:.5rem;border-bottom:1px solid #ddd}td:first-child,th:first-child{text-align:left}section{overflow:auto}a{color:#215b86}</style><header><a href="/">Coryell County Taxpayer Watchdog</a><h1 id="heading"></h1><button id="lang"></button></header><main><p id="notice"></p><div id="fields"></div><p id="base"></p><section><table><thead id="head"></thead><tbody id="out"></tbody></table></section><p id="method"></p><a href="https://www.copperascovetx.gov/DocumentCenter/View/7053/2026-27-Adopting-the-Fee-Schedule-PDF#page=19" id="source"></a></main><script>const $=x=>document.getElementById(x);let es=localStorage.getItem('lang')==='es';const fields=[['tax',0,'Current annual property taxes ($)','Impuestos prediales anuales actuales ($)',0,1000000],['utility',108.63,'Current monthly city utility charges ($)','Cargos municipales mensuales actuales ($)',0,100000],['taxGrowth',0,'Hypothetical annual property tax bill increase (%)','Aumento anual hipotético de impuestos (%)',-20,100],['utilityGrowth',0,'Hypothetical annual utility increase (%)','Aumento anual hipotético de servicios (%)',-20,100],['extra',0,'Additional hypothetical monthly fee ($), starting year 1','Cargo mensual hipotético adicional ($), desde el año 1',0,100000]];for(const [id,v,en,sp,min,max] of fields){let l=document.createElement('label');l.htmlFor=id;l.id=id+'label';let i=document.createElement('input');i.id=id;i.type='number';i.min=min;i.max=max;i.step='.01';i.value=v;i.oninput=calc;$('fields').append(l,i)}const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});function calc(){let vals=fields.map(([id,v,en,sp,min,max])=>Math.max(min,Math.min(max,Number($(id).value)||0)));let [t,u,g,h,e]=vals,b=t+12*u,cum=0;$('base').textContent=(es?'Costo anual inicial: ':'Current annual baseline: ')+money(b);$('out').replaceChildren();for(let y=1;y<=10;y++){let annual=t*(1+g/100)**y+12*u*(1+h/100)**y+12*e;cum+=annual-b;if([1,5,10].includes(y)){let tr=document.createElement('tr');for(let v of [y,money(annual/12),money(annual),money(cum)]){let td=document.createElement('td');td.textContent=v;tr.append(td)}$('out').append(tr)}}}function lang(){document.documentElement.lang=es?'es':'en';$('heading').textContent=es?'Simulador de costos del hogar':'Future household cost simulator';$('lang').textContent=es?'🇺🇸 English':'🇵🇷 Español';$('notice').textContent=es?'Escenarios hipotéticos, no pronósticos ni cargos aprobados. El valor inicial de $108.63 incluye cinco cargos básicos municipales, sin consumo. Ingrese su factura real.':'Hypothetical scenarios, not forecasts or approved charges. The $108.63 starting value includes five adopted city base charges, excluding consumption. Enter your actual bill for a personal estimate.';for(const [id,v,en,sp] of fields)$(id+'label').textContent=es?sp:en;$('head').replaceChildren();let tr=document.createElement('tr');for(let v of es?['Año','Mensual','Anual','Diferencia acumulada']:['Year','Monthly','Annual','Cumulative difference']){let th=document.createElement('th');th.textContent=v;tr.append(th)}$('head').append(tr);$('method').textContent=es?'Los aumentos se capitalizan anualmente desde el primer año. El cargo adicional permanece fijo. La diferencia acumulada compara con el costo inicial constante. No se guardan datos personales.':'Annual increases compound starting in year one. The additional fee stays fixed. Cumulative difference compares with an unchanged baseline. No personal data is stored.';$('source').textContent=es?'Fuente: ordenanza 2026-27, páginas PDF 11, 19 y 20':'Source: Ordinance 2026-27, PDF pages 11, 19 and 20';calc()}$('lang').onclick=()=>{es=!es;localStorage.setItem('lang',es?'es':'en');lang()};lang();</script></html>
