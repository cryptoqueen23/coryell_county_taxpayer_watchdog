Enter your actual bill for a personal estimate.';for(const [id,v,en,sp] of fields)$(id+'label').textContent=es?sp:en;$('head').replaceChildren();let tr=document.createElement('tr');for(let v of es?['Año','Mensual','Anual','Diferencia acumulada']:['Year','Monthly','Annual','Cumulative difference']){let th=document.createElement('th');th.textContent=v;tr.append(th)}$('head').append(tr);$('method').textContent=es?'Los aumentos se capitalizan anualmente desde el primer año. El cargo adicional permanece fijo. La diferencia acumulada compara con el costo inicial constante. No se guardan datos personales.':'Annual increases compound starting in year one. The additional fee stays fixed. Cumulative difference compares with an unchanged baseline. No personal data is stored.';$('source').textContent=es?'Fuente: ordenanza 2026-27, páginas PDF 11, 19 y 20':'Source: Ordinance 2026-27, PDF pages 11, 19 and 20';calc()}$('lang').onclick=()=>{es=!es;localStorage.setItem('lang',es?'es':'en');lang()};lang();</script><footer class="site-footer" id="site-footer"></footer><script>(()=>{const m=document.getElementById('site-menu'),n=document.getElementById('site-nav');const links=[...n.querySelectorAll('a')];links.forEach(a=>a.dataset.navEn=a.textContent);function sync(){const es=localStorage.getItem('lang')==='es';document.documentElement.lang=es?'es':'en';m.textContent=es?'☰ Menú':'☰ Menu';document.getElementById('site-tag').textContent=es?'Tres gobiernos. Un presupuesto familiar.':'Three Governments. One Household Budget.';document.getElementById('site-footer').textContent=es?'Dinero público. Documentos públicos. Rendición de cuentas.':'Public money. Public records. Public accountability.';links.forEach(a=>a.textContent=es?a.dataset.navEs:a.dataset.navEn)}m.onclick=()=>{n.hidden=!n.hidden;m.setAttribute('aria-expanded',String(!n.hidden))};document.getElementById('lang').addEventListener('click',sync);sync()})();</script><script>(()=>{const main=document.querySelector('main'),skip=document.getElementById('skip-main');if(!main||!skip)return;skip.href='#'+main.id;skip.addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({block:'start'})});function sync(){skip.textContent=localStorage.getItem('lang')==='es'?'Saltar al contenido principal':'Skip to main content'}sync();document.getElementById('lang')?.addEventListener('click',sync);const menu=document.getElementById('site-menu')||document.getElementById('menu');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu?.getAttribute('aria-expanded')==='true'){menu.click();menu.focus()}});})();</script></html>
