<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Records Vault</title><style>body{font:16px/1.5 system-ui;background:#f4f6f8;color:#142c43;margin:0}header,main{padding:1rem;max-width:960px;margin:auto}header{background:#142c43;color:white}header a{color:white}article{background:white;border-left:4px solid #b18a3e;padding:1rem;margin:1rem 0;overflow-wrap:anywhere}input,button{font:inherit;max-width:100%;padding:.5rem}code{overflow-wrap:anywhere}a{color:#215b86}.site-header{max-width:none;background:#142c43;color:white;padding:1rem}.site-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}.site-top small{color:#f4d28c;font-size:.72rem;letter-spacing:.05em}.site-top button{background:white;color:#142c43;border:1px solid #8595a5;border-radius:6px;padding:.5rem;font-size:.85rem;min-height:44px;margin-left:.3rem}.site-brand{display:block;font-size:clamp(1.65rem,5vw,2.6rem);font-weight:700;line-height:1.15;text-decoration:none;margin:1rem 0 .5rem}.site-header h1{font-size:1.25rem;margin:.8rem 0 0;border-top:1px solid #536577;padding-top:.8rem}.site-header p{margin:.5rem 0;color:#e4eaf0}#site-nav a{display:block;padding:.7rem .3rem;border-bottom:1px solid #536577;text-decoration:none}#site-nav[hidden]{display:none}.site-footer{background:#142c43;color:white;padding:1rem;text-align:center;font-size:.85rem}</style><header class="site-header"><div class="site-top"><small>THE CORYELL COUNTY SCOOP</small><div><button id="lang"></button><button id="site-menu" aria-expanded="false" aria-controls="site-nav">☰ Menu</button></div></div><a class="site-brand" href="/">Coryell County Taxpayer Watchdog</a><p id="site-tag"></p><nav id="site-nav" hidden><a href="/" data-nav-es="Inicio">Home</a><a href="/#calculator" data-nav-es="Costos del hogar">Household costs</a><a href="/spending.html" data-nav-es="Siga el dinero">Follow the Money</a><a href="/#debt" data-nav-es="Deuda pública">Government debt</a><a href="/vendors.html" data-nav-es="Pagos a proveedores">Vendor payments</a><a href="/simulator.html" data-nav-es="Costos futuros">Future costs</a><a href="/vault.html" data-nav-es="Documentos públicos">Public records</a><a href="/alerts.html" data-nav-es="Alertas financieras">Financial alerts</a></nav><h1 id="title"></h1></header><main><p id="intro"></p><label for="q" id="searchLabel"></label><input id="q" type="search"><p id="status" role="status"></p><div id="records"></div></main><script>const $=id=>document.getElementById(id);let es=localStorage.getItem('lang')==='es',docs=[];function tr(a,b){return es?b:a}function node(tag,t){let e=document.createElement(tag);e.textContent=t;return e}function render(){$('title').textContent=tr('Public Records Vault','Archivo de documentos públicos');$('lang').textContent=tr('🇵🇷 Español','🇺🇸 English');$('intro').textContent=tr('Source register and document integrity checks. A source link is not an archived copy. Missing archives and fingerprints are explicitly identified.','Registro de fuentes y verificación de integridad. Un enlace no es una copia archivada. Se identifican las copias y huellas pendientes.');$('searchLabel').textContent=tr('Search records','Buscar documentos');let q=$('q').value.toLowerCase(),a=docs.filter(d=>[d.title,d.issuer,d.id,d.year].join(' ').toLowerCase().includes(q));$('status').textContent=a.length+tr(' records',' documentos');$('records').replaceChildren();for(let d of a){let c=document.createElement('article');c.append(node('h2',d.title||d.id),node('p',[d.id,d.issuer,d.year].filter(Boolean).join(' · ')),node('p',d.status||''),node('p',tr('PDF page: ','Página PDF: ')+(d.pdfPage??tr('Not recorded','No registrada'))));for(let [url,label] of [[d.url,tr('Official source','Fuente oficial')],[d.archiveUrl,tr('Archived original','Original archivado')]]){if(url&&/^https?:\/\//.test(url)){let p=document.createElement('p'),a=document.createElement('a');a.href=url;a.textContent=label;p.append(a);c.append(p)}}if(!d.archiveUrl)c.append(node('p',tr('Original archive pending','Copia original pendiente')));if(d.sha256){c.append(node('p','SHA-256'),node('code',d.sha256));let label=node('label',tr('Verify your local PDF (not uploaded)','Verifique su PDF local (no se sube)')),input=document.createElement('input'),out=node('p','');input.type='file';input.accept='.pdf,application/pdf';label.append(input);input.onchange=async()=>{try{let f=input.files[0];if(!f)return;let bytes=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());let hash=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');out.textContent=hash===d.sha256.toLowerCase()?tr('Fingerprint matches registered value','La huella coincide'):tr('Fingerprint differs: different file or version','Huella distinta: otro archivo o versión')}catch(e){out.textContent=tr('Verification unavailable','Verificación no disponible')}};c.append(label,out)}else c.append(node('p',tr('Fingerprint pending','Huella pendiente')));$('records').append(c)}}$('q').oninput=render;$('lang').onclick=()=>{es=!es;localStorage.setItem('lang',es?'es':'en');document.documentElement.lang=es?'es':'en';render()};render();fetch('canon.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{docs=d;render()}).catch(()=>{$('status').textContent=tr('Unable to load records','No se pudo cargar el registro')});</script><footer class="site-footer" id="site-footer"></footer><script>(()=>{const m=document.getElementById('site-menu'),n=document.getElementById('site-nav');const links=[...n.querySelectorAll('a')];links.forEach(a=>a.dataset.navEn=a.textContent);function sync(){const es=localStorage.getItem('lang')==='es';document.documentElement.lang=es?'es':'en';m.textContent=es?'☰ Menú':'☰ Menu';document.getElementById('site-tag').textContent=es?'Tres gobiernos. Un presupuesto familiar.':'Three Governments. One Household Budget.';document.getElementById('site-footer').textContent=es?'Dinero público. Documentos públicos. Rendición de cuentas.':'Public money. Public records. Public accountability.';links.forEach(a=>a.textContent=es?a.dataset.navEs:a.dataset.navEn)}m.onclick=()=>{n.hidden=!n.hidden;m.setAttribute('aria-expanded',String(!n.hidden))};document.getElementById('lang').addEventListener('click',sync);sync()})();</script></html>
